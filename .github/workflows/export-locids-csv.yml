name: "Export LOCIDs CSV"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * 3' # 02:00 every Wednesday

jobs:
  export-locids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Export LOCIDs CSV
        run: |
          python code/export_locids_csv.py --output results/locids.csv --no-progress

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: "export-locids-$(date +'%Y%m%d')"
          release_name: "Export LOCIDs CSV $(date +'%Y-%m-%d')"
          body: "Automated export of LOCIDs CSV."
          draft: false
          prerelease: false

      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        with:
          upload_url: "${{ steps.create_release.outputs.upload_url }}"
          asset_path: "results/locids.csv"
          asset_name: "locids.csv"
          asset_content_type: "text/csv"


