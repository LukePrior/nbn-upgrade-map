name: "Export LOCIDs CSV"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * 3' # 02:00 every Wednesday

jobs:
  export-locids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Export LOCIDs CSV
        run: |
          python code/export_locids_csv.py --output results/locids.csv --no-progress

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: results/locids.csv
          tag_name: "export-locids-$(date +'%Y%m%d')"
          name: "Export LOCIDs CSV $(date +'%Y-%m-%d')"
          body: "Automated export of LOCIDs CSV."
          draft: false
          prerelease: false


