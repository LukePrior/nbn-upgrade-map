name: "Export LOCIDs CSV"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * 3' # 02:00 every Wednesday

jobs:
  export-locids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Export LOCIDs CSV
        run: |
          python code/export_locids_csv.py --output results/locids.csv --no-progress

      - name: Configure Git User
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

      - name: Force Add and Push if Necessary
        run: |
          git add -f results/locids.csv
          git commit -m "Force add LOCIDs CSV" || echo "No changes to commit"
          git push || echo "Push failed"
