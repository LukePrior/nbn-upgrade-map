name: "Export LOCIDs CSV"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * 3' # 02:00 every Wednesday

jobs:
  export-locids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Export LOCIDs CSV
        run: |
          python code/export_locids_csv.py --output results/locids.csv --no-progress

      - name: Verify File Creation
        run: |
          if [ ! -f results/locids.csv ]; then
            echo "Error: results/locids.csv not found!";
            exit 1;
          fi

      - name: Commit CSV
        uses: EndBug/add-and-commit@v9
        with:
          add: 'results/locids.csv'
          message: Export LOCIDs CSV
          default_author: github_actions
          pull: '--rebase --autostash'

      - name: Force Add and Push if Necessary
        run: |
          git add -f results/locids.csv
          git commit -m "Force add LOCIDs CSV" || echo "No changes to commit"
          git push || echo "Push failed"
