name: "Export LOCIDs CSV"

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 2 * * 3' # 02:00 every Wednesday

jobs:
  export-locids:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Export LOCIDs CSV
        run: |
          python code/export_locids_csv.py --output results/locids.csv --no-progress --all-fields

      - name: Generate Tag Name
        id: generate_tag
        run: echo "tag_name=export-locids-$(date +'%Y%m%d')" >> $GITHUB_ENV

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: results/locids.csv
          tag_name: ${{ env.tag_name }}
          name: Export LOCIDs CSV ${{ env.tag_name }}
          body: Automated export of LOCIDs CSV.
          draft: false
          prerelease: false



