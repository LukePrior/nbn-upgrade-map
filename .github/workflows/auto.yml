name: Suburb Automatic
on:
  workflow_dispatch:
  repository_dispatch:
    types: [auto-suburb]

jobs:
  auto-suburb:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Sleep for 10 seconds
        run: sleep 10s
        shell: bash

      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker
        run: |
          docker pull lukeprior/nbn-upgrade-map-db:latest
          docker run -d --publish=5433:5432 lukeprior/nbn-upgrade-map-db:latest

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r code/requirements.txt

      - name: Run program
        run: |
          python code/main.py -i -t 60

      - name: Generate Sitemap
        run: |
          python code/sitemap.py

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: Updated regions & results
          default_author: github_actions
          fetch: false
          tag_push: '--force'

      - name: Push sitemap
        if: success()
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: static-deploy

      - name: Start new workflow
        if: always()
        uses: peter-evans/repository-dispatch@v3
        with:
          event-type: auto-suburb
